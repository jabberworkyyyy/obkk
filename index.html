<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咔咔吸炒菜评分榜 · 奥比托之家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f0ede8;
            --bg-card: #ffffff;
            --bg-hover: #f5f3ef;
            --text-primary: #3d3a36;
            --text-secondary: #7a756e;
            --text-light: #a09b94;
            --border-color: #e0dcd4;
            --star-color: #c4a35a;
            --star-empty: #d8d4cc;
            --accent-green: #8ba888;
            --accent-red: #c97c7c;
            --accent-blue: #7a9bb5;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px 12px 40px;
            max-width: 480px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 密码锁遮罩 ===== */
        #password-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            padding: 20px;
        }
        #password-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .lock-box {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 32px 28px 28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            max-width: 340px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .lock-icon {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
        }

        .lock-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .lock-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .lock-input-wrap {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 2px 2px 2px 14px;
            transition: border-color 0.3s;
        }
        .lock-input-wrap:focus-within {
            border-color: var(--accent-blue);
        }
        .lock-input-wrap input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 18px;
            letter-spacing: 6px;
            width: 160px;
            padding: 10px 0;
            font-family: inherit;
        }
        .lock-input-wrap input::placeholder {
            color: var(--text-light);
            letter-spacing: 1px;
            font-size: 13px;
        }
        .lock-btn {
            background: var(--text-primary);
            border: none;
            color: var(--bg-card);
            font-size: 14px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .lock-btn:hover {
            background: #2a2824;
        }
        .lock-btn:active {
            transform: scale(0.97);
        }
        .lock-error {
            font-size: 13px;
            color: var(--accent-red);
            margin-top: 12px;
            min-height: 20px;
            transition: all 0.3s;
        }
        .lock-error.shake {
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* ===== 五个带土介绍弹窗 ===== */
        #reviewers-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #reviewers-overlay.active {
            display: flex;
        }

        .reviewers-modal {
            background: var(--bg-card);
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px 20px 20px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .reviewers-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .reviewers-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .reviewers-close {
            font-size: 20px;
            color: var(--text-light);
            cursor: pointer;
            line-height: 1;
            background: none;
            border: none;
            padding: 0 4px;
        }
        .reviewers-close:hover {
            color: var(--text-primary);
        }

        .reviewer-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .reviewer-row:last-child {
            border-bottom: none;
        }

        .reviewer-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            color: #fff;
            font-weight: 600;
        }

        .reviewer-info {
            flex: 1;
            min-width: 0;
        }
        .reviewer-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .reviewer-style {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            line-height: 1.5;
        }

        /* ===== 列表页样式 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            font-size: 22px;
            color: var(--text-primary);
            cursor: pointer;
            line-height: 1;
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon {
            font-size: 20px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .sub-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px 12px;
        }

        .sub-header-tabs {
            display: flex;
            gap: 20px;
        }

        .tab-item {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-item.active {
            color: var(--text-primary);
            border-bottom-color: var(--text-primary);
        }

        .tab-item:hover {
            color: var(--text-primary);
        }

        .filter-btn {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .score-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .score-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
            border: 1px solid transparent;
        }

        .score-item:hover {
            background: var(--bg-hover);
            border-color: var(--border-color);
        }

        .score-item:active {
            transform: scale(0.98);
        }

        .square-box {
            width: 52px;
            height: 52px;
            background: #e8e4dc;
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--text-secondary);
            overflow: hidden;
            position: relative;
        }

        .square-box-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .square-box .icon-text {
            font-size: 28px;
            line-height: 1;
        }

        .item-desc {
            flex: 1;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.4;
            padding: 0 4px;
            letter-spacing: 0.3px;
        }

        .item-right {
            flex-shrink: 0;
            text-align: right;
            min-width: 80px;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .item-score {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .item-score .score-num {
            font-size: 20px;
        }

        .item-score .score-total {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .item-stars {
            display: flex;
            gap: 1px;
            justify-content: flex-end;
            margin-top: 1px;
        }

        .star {
            font-size: 11px;
            color: var(--star-color);
        }

        .star.empty {
            color: var(--star-empty);
        }

        /* ===== 详情页 ===== */
        .detail-page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-page.active {
            display: block;
        }

        .list-page.hidden {
            display: none;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 4px 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .detail-back {
            font-size: 22px;
            cursor: pointer;
            color: var(--text-primary);
            line-height: 1;
        }

        .detail-title {
            font-size: 17px;
            font-weight: 700;
        }

        .detail-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 24px;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }

        .hero-square {
            width: 72px;
            height: 72px;
            background: #e8e4dc;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 12px;
        }

        .hero-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .hero-score {
            font-size: 36px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .hero-score .hero-score-total {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .hero-review-count {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .hero-stars-row {
            display: flex;
            gap: 3px;
            margin-bottom: 14px;
        }

        .hero-star {
            font-size: 20px;
            color: var(--star-color);
        }

        .hero-star.empty {
            color: var(--star-empty);
        }

        .star-distribution {
            width: 100%;
            max-width: 280px;
            padding: 0 16px;
        }

        .star-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .star-label {
            font-size: 12px;
            color: var(--text-secondary);
            width: 30px;
            text-align: right;
            flex-shrink: 0;
        }

        .star-bar-bg {
            flex: 1;
            height: 6px;
            background: var(--star-empty);
            border-radius: 3px;
            overflow: hidden;
        }

        .star-bar-fill {
            height: 100%;
            background: var(--star-color);
            border-radius: 3px;
            transition: width 0.6s ease;
        }

        .star-count {
            font-size: 12px;
            color: var(--text-secondary);
            width: 24px;
            text-align: left;
            flex-shrink: 0;
        }

        .comments-section {
            margin-top: 4px;
        }

        .comments-title {
            font-size: 15px;
            font-weight: 600;
            padding: 12px 4px 8px;
            color: var(--text-primary);
        }

        .comment-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 8px;
            box-shadow: var(--shadow);
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .comment-user {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .comment-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e0dcd4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .comment-username {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .comment-stars {
            display: flex;
            gap: 1px;
        }

        .comment-star {
            font-size: 13px;
            color: var(--star-color);
        }

        .comment-star.empty {
            color: var(--star-empty);
        }

        .comment-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-primary);
            word-break: break-word;
        }

        .comment-actions {
            display: flex;
            gap: 20px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
        }

        .comment-action {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        @media (max-width: 360px) {
            .item-desc { font-size: 12px; }
            .item-name { font-size: 12px; }
            .item-score .score-num { font-size: 17px; }
            .square-box { width: 44px; height: 44px; }
            .lock-input-wrap input { width: 120px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- ===== 密码锁遮罩 ===== -->
    <div id="password-overlay">

    <!-- ===== LIST PAGE ===== -->
    <div id="listPage" class="list-page">

        <div class="comments-section">

            <div id="commentsList"></div>

    </div>

var passwordOverlay = document.getElementById('password-overlay');
var passwordInput = document.getElementById('password-input');
var passwordBtn = document.getElementById('password-btn');
var lockError = document.getElementById('lock-error');

var CORRECT_PASSWORD = '210915';

function unlockPage() {
passwordOverlay.classList.add('hidden');
lockError.textContent = '';
}

function handlePassword() {
var val = passwordInput.value.trim();
if (val === CORRECT_PASSWORD) {
unlockPage();
} else {
lockError.textContent = '密码错误，请重试';
lockError.classList.remove('shake');
void lockError.offsetWidth;
lockError.classList.add('shake');
passwordInput.value = '';
passwordInput.focus();
}
}

passwordBtn.addEventListener('click', handlePassword);
passwordInput.addEventListener('keydown', function(e) {
if (e.key === 'Enter') {
handlePassword();
}
});

// =============================================
// 渲染列表
// =============================================
function renderList() {
var list = document.getElementById('scoreList');
list.innerHTML = '';
for (var i = 0; i < kakashiData.length; i++) {
var item = kakashiData[i];
var totalStars = 5;
var fullStars = Math.floor(item.score / 2);
var halfStar = (item.score / 2) % 1 >= 0.25;
var emptyStars = totalStars - fullStars - (halfStar ? 1 : 0);

var starsHtml = '';
for (var j = 0; j < fullStars; j++) {
starsHtml += '<span class="star">★</span>';
}
if (halfStar) {
starsHtml += '<span class="star">★</span>';
}
for (var k = 0; k < emptyStars; k++) {
starsHtml += '<span class="star empty">★</span>';
}

var scoreItem = document.createElement('div');
scoreItem.className = 'score-item';

(function(data) {
scoreItem.addEventListener('click', function() {
openDetail(data);
});
})(item);

scoreItem.innerHTML = '<div class="square-box">' +
'<div class="square-box-inner">' +
'<span class="icon-text">' + item.icon.trim() + '</span>' +
'</div>' +
'</div>' +
'<div class="item-desc">' + item.desc + '</div>' +
'<div class="item-right">' +
'<div class="item-name">' + item.name + '</div>' +
'<div class="item-score">' +
'<span class="score-num">' + item.score + '</span>' +
'<span class="score-total">/10</span>' +
'</div>' +
'<div class="item-stars">' + starsHtml + '</div>' +
'</div>';

list.appendChild(scoreItem);
}
}

// =============================================
// 打开详情页
// =============================================
function openDetail(item) {
document.getElementById('listPage').classList.add('hidden');
var detailPage = document.getElementById('detailPage');
detailPage.classList.add('active');

document.getElementById('detailTitle').textContent = item.name;
document.getElementById('heroSquare').textContent = item.icon;
document.getElementById('heroName').textContent = item.name;
document.getElementById('heroScoreNum').textContent = item.score;
document.getElementById('heroReviewCount').textContent = '共 ' + item.comments.length + ' 条评分';

var totalStars = 5;
var fullStars = Math.floor(item.score / 2);
var halfStar = (item.score / 2) % 1 >= 0.25;
var emptyStars = totalStars - fullStars - (halfStar ? 1 : 0);
var heroStarsHtml = '';
for (var i = 0; i < fullStars; i++) {
heroStarsHtml += '<span class="hero-star">★</span>';
}
if (halfStar) {
heroStarsHtml += '<span class="hero-star">★</span>';
}
for (var j = 0; j < emptyStars; j++) {
heroStarsHtml += '<span class="hero-star empty">★</span>';
}
document.getElementById('heroStarsRow').innerHTML = heroStarsHtml;

var distContainer = document.getElementById('starDistribution');
var starCounts = [0, 0, 0, 0, 0];
for (var k = 0; k < item.comments.length; k++) {
var s = Math.round(item.comments[k].stars);
if (s >= 1 && s <= 5) {
starCounts[s - 1]++;
}
}
var distHtml = '';
for (var m = 5; m >= 1; m--) {
var count = starCounts[m - 1] || 0;
var pct = item.comments.length > 0 ? (count / item.comments.length * 100) : 0;
distHtml += '<div class="star-row">' +
'<span class="star-label">' + m + '星</span>' +
'<div class="star-bar-bg">' +
'<div class="star-bar-fill" style="width:' + pct + '%"></div>' +
'</div>' +
'<span class="star-count">' + count + '</span>' +
'</div>';
}
distContainer.innerHTML = distHtml;

var commentsContainer = document.getElementById('commentsList');
commentsContainer.innerHTML = '';
for (var n = 0; n < item.comments.length; n++) {
var c = item.comments[n];
var commentStarsHtml = '';
for (var p = 0; p < 5; p++) {
if (p < c.stars) {
commentStarsHtml += '<span class="comment-star">★</span>';
} else {
commentStarsHtml += '<span class="comment-star empty">★</span>';
}
}
var commentItem = document.createElement('div');
commentItem.className = 'comment-item';
commentItem.innerHTML = '<div class="comment-header">' +
'<div class="comment-user">' +
'<div class="comment-avatar">' + c.avatar + '</div>' +
'<span class="comment-username">' + c.user + '</span>' +
'</div>' +
'<div class="comment-stars">' + commentStarsHtml + '</div>' +
'</div>' +
'<div class="comment-text">' + c.text + '</div>' +
'<div class="comment-actions">' +
'<span class="comment-action">👍 ' + (Math.floor(Math.random() * 20) + 5) + '</span>' +
'<span class="comment-action">💬 回复</span>' +
'<span class="comment-action">🔗 分享</span>' +
'</div>';
commentsContainer.appendChild(commentItem);
}

window.scrollTo({ top: 0, behavior: 'smooth' });
}
