<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 6 Wuxia Paro - Interactive Preview</title>
  <style>
    :root {
      --bg: #eee9df;
      --paper: #fbfaf6;
      --paper-deep: #f1e8dc;
      --ink: #3e3832;
      --muted: #7f756a;
      --line: #dacdbd;
      --seal: #a85f58;
      --bronze: #9b7c58;
      --sage: #8f9b83;
      --night: #4d5554;
      --shadow: 0 18px 45px rgba(60, 45, 32, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(168, 95, 88, .12), transparent 28%),
        radial-gradient(circle at 80% 22%, rgba(143, 155, 131, .16), transparent 30%),
        linear-gradient(135deg, #e9e1d5, #f7f2eb);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.74;
    }

    button { font: inherit; }

    .game-app {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .game-shell {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .side-panel,
    .story-panel {
      border: 1px solid rgba(218, 205, 189, .9);
      border-radius: 10px;
      background: rgba(251, 250, 246, .94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .side-panel {
      position: sticky;
      top: 18px;
    }

    .side-cover {
      padding: 18px 18px 16px;
      background: linear-gradient(135deg, #8d7565, #b18b6a);
      color: #fffaf2;
    }

    .side-cover p {
      margin: 0 0 4px;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .82;
    }

    .side-cover h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.26;
      letter-spacing: 0;
    }

    .progress-list {
      padding: 12px;
      display: grid;
      gap: 8px;
      background: #f7f2eb;
    }

    .progress-item {
      border: 0;
      border-radius: 8px;
      padding: 10px 11px;
      color: var(--muted);
      background: rgba(255,255,255,.66);
      text-align: left;
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }

    .progress-item.is-active {
      color: #fffaf2;
      background: var(--night);
    }

    .progress-item.is-locked {
      cursor: default;
      opacity: .52;
    }

    .progress-item strong {
      display: block;
      font-size: 13px;
      line-height: 1.35;
    }

    .progress-item span {
      display: block;
      margin-top: 2px;
      font-size: 11px;
    }

    .status-card {
      margin: 0;
      padding: 14px 18px 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      background: #fbf8f1;
    }

    .story-panel {
      min-height: 720px;
      position: relative;
    }

    .story-panel:before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(155,124,88,.08) 0 1px, transparent 1px 100%),
        linear-gradient(rgba(155,124,88,.045) 0 1px, transparent 1px 100%);
      background-size: 34px 34px;
      opacity: .42;
    }

    .chapter-view {
      position: relative;
      z-index: 1;
      padding: 26px 30px 32px;
    }

    .chapter-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .chapter-kicker {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .chapter-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .story-scroll {
      max-height: 560px;
      overflow: auto;
      padding: 4px 12px 4px 0;
      scrollbar-color: #bca58d #f4eee5;
    }

    .story-block {
      padding: 2px 4px 4px;
      background: transparent;
    }

    .story-block p,
    .result-body p,
    .ending-card .story-line {
      margin: 0 0 1em;
      text-align: justify;
      text-indent: 2em;
    }

    .story-block p:last-child,
    .result-body p:last-child { margin-bottom: 0; }

    .placeholder {
      color: #796f64;
      border-left: 3px solid rgba(168,95,88,.48);
      background: rgba(255,255,255,.42);
      padding: 10px 12px;
      text-indent: 0 !important;
    }

    .dramatic-line {
      margin: 24px auto 26px !important;
      max-width: 76%;
      min-height: 72px;
      padding: 10px 0;
      color: var(--seal);
      font-size: 24px;
      font-weight: 800;
      font-style: italic;
      line-height: 1.48;
      text-align: center !important;
      text-indent: 0 !important;
      letter-spacing: 0;
      opacity: 0;
      filter: blur(3px);
      transform: translateY(8px);
      transition: opacity .55s ease, filter .55s ease, transform .55s ease;
    }

    .dramatic-line.is-visible {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0);
    }

    .inline-note {
      border: 0;
      border-bottom: 1px solid var(--seal);
      padding: 0 1px 1px;
      color: var(--seal);
      background: transparent;
      cursor: pointer;
      line-height: 1.2;
    }

    .inline-note.note-red {
      color: var(--seal);
      border-bottom-color: var(--seal);
    }

    .inline-note.note-blue {
      color: #5f7892;
      border-bottom-color: #5f7892;
    }

    .note-modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(44, 36, 29, .34);
      backdrop-filter: blur(2px);
    }

    .note-modal.is-visible { display: flex; }

    .note-card {
      position: relative;
      width: min(560px, 100%);
      max-height: min(72vh, 560px);
      overflow: auto;
      border: 1px solid rgba(154, 119, 86, .46);
      border-radius: 12px;
      padding: 34px 48px 30px;
      background:
        linear-gradient(90deg, rgba(188,152,111,.44) 0 22px, transparent 22px calc(100% - 22px), rgba(188,152,111,.44) calc(100% - 22px)),
        linear-gradient(180deg, #fff7e9, #f9edda 54%, #fffaf0);
      box-shadow: 0 24px 70px rgba(42, 31, 22, .26);
    }

    .note-card:before,
    .note-card:after {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #8c6b4e, #c19a68, #8c6b4e);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.45), 0 4px 10px rgba(82, 58, 38, .18);
    }

    .note-card:before { top: 12px; }
    .note-card:after { bottom: 12px; }

    .note-card p {
      position: relative;
      margin: 0 0 20px;
      color: var(--ink);
      line-height: 1.82;
      text-indent: 0;
      text-align: justify;
    }

    .note-card p:before {
      content: "卷宗注";
      display: block;
      margin: 0 0 10px;
      color: var(--bronze);
      font-size: 12px;
      letter-spacing: .18em;
    }

    .note-close {
      display: block;
      margin: 0 auto;
      border: 0;
      border-radius: 999px;
      padding: 8px 18px;
      background: var(--night);
      color: #fffaf2;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(77, 85, 84, .2);
    }

    .note-close:hover { background: #364140; }

    .switch-reveal {
      min-height: 150px;
      margin: 24px auto 26px;
      padding: 18px 18px;
      border-top: 1px dashed var(--line);
      border-bottom: 1px dashed var(--line);
      background: rgba(255,253,249,.38);
      text-align: center;
    }

    .switch-reveal-text {
      margin: 0;
      min-height: 86px;
      color: var(--muted);
      text-align: justify;
      text-indent: 2em;
      opacity: 0;
      transition: opacity 1.15s ease;
    }

    .switch-reveal-text.is-visible { opacity: 1; }

    .switch-reveal-button {
      margin-top: 12px;
      border: 1px solid rgba(177,139,106,.72);
      border-radius: 999px;
      padding: 7px 13px;
      color: var(--muted);
      background: rgba(255,253,249,.78);
      cursor: pointer;
    }

    .choice-area {
      position: relative;
      margin-top: 24px;
      padding: 16px 0 0;
      border-top: 1px solid var(--line);
      background: transparent;
    }

    .choice-title {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .choice-button {
      border: 1px solid rgba(177,139,106,.62);
      border-radius: 8px;
      padding: 12px 13px;
      background: rgba(255,253,249,.72);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .choice-button:hover,
    .choice-button:focus-visible {
      outline: 0;
      transform: translateY(-2px);
      border-color: var(--seal);
      box-shadow: 0 10px 22px rgba(85,62,43,.12);
    }

    .choice-button b {
      display: inline-block;
      min-width: 28px;
      color: var(--seal);
      font-family: "Courier New", monospace;
    }

    .result-panel {
      display: none;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
      background: transparent;
    }

    .result-panel.is-visible { display: block; }

    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .result-head strong {
      color: var(--ink);
      font-size: 14px;
    }

    .result-body {
      padding: 0;
    }

    .result-body p {
      margin: 0 0 10px;
    }

    .result-body p:last-child { margin-bottom: 0; }

    .next-button,
    .reset-button {
      border: 0;
      border-radius: 999px;
      padding: 9px 15px;
      color: #fffaf2;
      background: var(--night);
      cursor: pointer;
    }

    .reset-button {
      background: var(--seal);
    }

    .ending-view {
      display: none;
      position: relative;
      z-index: 1;
      padding: 48px 30px;
      min-height: 720px;
      align-items: center;
      justify-content: center;
    }

    .ending-view.is-visible { display: flex; }

    .ending-card {
      width: min(580px, 100%);
      border-radius: 10px;
      border: 1px solid rgba(168,95,88,.45);
      background: rgba(251,250,246,.94);
      box-shadow: var(--shadow);
      padding: 28px;
      text-align: center;
    }

    .ending-card p {
      margin: 0 0 14px;
      color: var(--muted);
    }

    .ending-card h2 {
      margin: 0 0 18px;
      color: var(--seal);
      font-size: 26px;
      line-height: 1.3;
    }

    .hidden { display: none !important; }

    @media (max-width: 760px) {
      body { font-size: 14.5px; }
      .game-app { width: min(100% - 16px, 1080px); padding: 10px 0 24px; }
      .game-shell { grid-template-columns: 1fr; gap: 10px; }
      .side-panel { position: static; box-shadow: none; }
      .side-cover { padding: 14px 14px 12px; }
      .side-cover h1 { font-size: 19px; }
      .progress-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; padding: 8px; }
      .progress-item { padding: 8px 7px; text-align: center; }
      .progress-item strong { font-size: 12px; }
      .status-card { padding: 10px 12px; }
      .story-panel { min-height: 0; box-shadow: none; }
      .chapter-view { padding: 18px 14px 20px; }
      .chapter-top { gap: 10px; margin-bottom: 14px; }
      .chapter-title { font-size: 22px; }
      .story-scroll { max-height: none; overflow: visible; padding-right: 0; }
      .story-block { padding: 0; }
      .dramatic-line { max-width: 100%; min-height: 62px; font-size: 20px; }
      .choice-area { padding: 14px 0 0; }
      .choice-grid { grid-template-columns: 1fr; gap: 9px; }
      .choice-button { padding: 12px; }
      .ending-view { min-height: 420px; padding: 22px 14px; }
      .ending-card { padding: 22px 16px; }
    }
  </style>
</head>
<body>
  <main class="game-app">
    <div class="game-shell">
      <aside class="side-panel" aria-label="game progress">
        <div class="side-cover">
          <p>chapter 06</p>
          <h1>刀剑易得，真心难求</h1>
        </div>
        <nav class="progress-list" id="progressList"></nav>
        <p class="status-card" id="statusText">选择正确路线后，会解锁下一章节。</p>
      </aside>

      <section class="story-panel">
        <article class="chapter-view" id="chapterView"></article>
        <article class="ending-view" id="endingView" aria-live="polite"></article>
      </section>
    </div>
  </main>

  <div class="note-modal" id="noteModal" aria-hidden="true">
    <div class="note-card" role="dialog" aria-modal="true">
      <p id="noteModalText"></p>
      <button class="note-close" type="button" id="noteClose">关闭</button>
    </div>
  </div>

                        ]
                  },
                  {
                        "key": "B",
                        "label": "承露",
                        "correct": true,
                        "reward": true,
                        "resultTitle": "奖励路线",
                        "result": [
                              "不消一会儿，卡卡西已经轮番去了三、四次，而带土却仍然硬挺着，没有一丝要射精的意思。他就着这个相连的姿势翻了个身，从背后紧紧贴着这副炙热的身躯，将卡卡西整个人圈在怀里，又把他的左腿抬起来挂在自己的臂弯上。",
                              "这个姿势让卡卡西的屄穴能夹得更紧，原本因为过度使用而微微松软的腔道，因为双腿被人为摆弄得再次变得紧致起来。带土低下头在身侧人的肩颈和锁骨窝处啃咬深吻，留下星星点点的红痕，一边在契合万分的肉锁里缓慢地抽送着，一边又伸手绕到卡卡西身前，手指拨开肉瓣，揉捏掐弄阴蒂。",
                              "被肏到深处骚点、又被玩弄阴蒂的双重快感侵袭着，卡卡西的呻吟也变得断断续续，他的双腿本能地想要合拢，却被带土用膝盖抵住，被迫保持着大开的状态迎接他的每一次深入。",
                              "那杵铁棍在柔软的体内碾压出滋滋作响的水声，连同卡卡西整个人的心脏、思维也被反复揉捏榨取。",
                              "“啊、嗯啊、带——带土——不、不行了、要去了——嗯啊！”",
                              "被不停喊着名字的人此时终于快要到临界点，圈着卡卡西的手臂更紧地箍住，腰身开始最后的冲刺，欲火已不能再被克制，每一下又快又深，囊袋拍打臀瓣、肉穴咕啾着分泌流不尽的淫水，耳边只剩下激烈交合的声音，和卡卡西不停发出的‘要坏了’或是‘要去了’的淫乱尖叫。",
                              "炉鼎仿佛水做的一般，卡卡西的肉穴深处一点也没有要枯竭的意思，再次喷出一股热液，带土被浇得浑身一个激灵，低吼一声释放，把滚烫的浓精灌进肉壶，因为一直在忍耐的缘故，那股精液又多又浓，卡卡西的高潮也十分深重，那些精液便被锁进了肉壶深处，几乎要将他的肚皮下也填满。"
                        ]
                  }
            ]
      }
];

    let current = 0;
    let unlocked = 0;
    const chapterView = document.getElementById("chapterView");
    const endingView = document.getElementById("endingView");
    const progressList = document.getElementById("progressList");
    const statusText = document.getElementById("statusText");
    const noteModal = document.getElementById("noteModal");
    const noteModalText = document.getElementById("noteModalText");
    const noteClose = document.getElementById("noteClose");

    function escapeAttr(text) {
      return escapeHtml(text).replace(/'/g, "&#39;");
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderInlineNotes(text) {
      const pattern = /（(.+?)(?:二字|儿子)?(?:为(红色|蓝色)\+)?(?:加下划线|下划线)，点击后弹出(?:一个)?窗口：([^）]+)）|（(.+?)(?:二字|儿子)?(?:为(红色|蓝色)\+)?(?:加下划线|下划线)，点击后弹窗：([^）]+)）/g;
      let result = "";
      let last = 0;
      let match;
      while ((match = pattern.exec(text))) {
        const target = (match[1] || match[4] || "").trim();
        const color = (match[2] || match[5] || "").trim();
        const note = (match[3] || match[6] || "").trim();
        let segment = text.slice(last, match.index);
        const targetIndex = segment.lastIndexOf(target);
        if (target && targetIndex >= 0) {
          result += escapeHtml(segment.slice(0, targetIndex));
          result += '<button class="inline-note ' + (color === "蓝色" ? "note-blue" : color === "红色" ? "note-red" : "") + '" type="button" data-note="' + escapeAttr(note) + '">' + escapeHtml(target) + '</button>';
          result += escapeHtml(segment.slice(targetIndex + target.length));
        } else {
          result += escapeHtml(segment);
        }
        last = match.index + match[0].length;
      }
      result += escapeHtml(text.slice(last));
      return result;
    }

    function renderParagraph(line) {
      if (line && typeof line === "object" && line.type === "switchReveal") {
        return '<div class="switch-reveal" data-switch-reveal data-stage="0" data-first="' + escapeAttr(line.first || "") + '" data-second="' + escapeAttr(line.second || "") + '"><p class="switch-reveal-text"></p><button class="switch-reveal-button" type="button">点击查看</button></div>';
      }
      const marker = "（加粗斜体放大中央，点击屏幕后出现）";
      const text = String(line);
      if (text.includes(marker)) {
        return '<p class="dramatic-line" data-reveal="tap">' + escapeHtml(text.replace(marker, "")) + '</p>';
      }
      const cls = text.includes("可替换文本区") || text.includes("后续章节待补") ? ' class="placeholder"' : '';
      return '<p' + cls + '>' + renderInlineNotes(text) + '</p>';
    }

    function revealNextLine() {
      const hiddenLine = chapterView.querySelector('.dramatic-line:not(.is-visible)');
      if (hiddenLine) hiddenLine.classList.add('is-visible');
    }

    function openInlineNote(text) {
      noteModalText.textContent = text;
      noteModal.classList.add("is-visible");
      noteModal.setAttribute("aria-hidden", "false");
      noteClose.focus();
    }

    function closeInlineNote() {
      noteModal.classList.remove("is-visible");
      noteModal.setAttribute("aria-hidden", "true");
      noteModalText.textContent = "";
    }

    function advanceSwitchReveal(box) {
      const stage = Number(box.dataset.stage || "0");
      if (stage >= 2) return;
      const text = stage === 0 ? box.dataset.first : box.dataset.second;
      const target = box.querySelector(".switch-reveal-text");
      const button = box.querySelector(".switch-reveal-button");
      target.classList.remove("is-visible");
      window.setTimeout(function() {
        target.textContent = text || "";
        target.offsetHeight;
        target.classList.add("is-visible");
      }, 80);
      box.dataset.stage = String(stage + 1);
      if (stage === 0) {
        button.textContent = "再次点击";
      } else {
        button.textContent = "已显示";
        button.disabled = true;
      }
    }

    function renderProgress() {
      progressList.innerHTML = chapters.map(function(chapter, index) {
        const locked = index > unlocked;
        return '<button class="progress-item ' + (index === current ? 'is-active ' : '') + (locked ? 'is-locked' : '') + '" type="button" data-index="' + index + '"' + (locked ? ' disabled' : '') + '>' +
          '<strong>' + escapeHtml(chapter.title) + '</strong><span>' + (locked ? '未解锁' : index === current ? '进行中' : '可回看') + '</span></button>';
      }).join("");
    }

    function renderChapter(index) {
      current = index;
      endingView.classList.remove("is-visible");
      endingView.innerHTML = "";
      chapterView.classList.remove("hidden");
      const chapter = chapters[index];
      chapterView.innerHTML =
        '<header class="chapter-top"><div><h2 class="chapter-title">' + escapeHtml(chapter.title) + '</h2></div></header>' +
        '<section class="story-scroll" data-story-reader><div class="story-block">' + chapter.body.map(renderParagraph).join("") + '</div></section>' +
        (chapter.choices.length ? '<section class="choice-area"><p class="choice-title">选择</p><div class="choice-grid">' +
        chapter.choices.map(function(choice) {
          return '<button class="choice-button" type="button" data-choice="' + choice.key + '"><b>' + choice.key + '</b>' + escapeHtml(choice.label) + '</button>';
        }).join("") +
        '</div><div class="result-panel" id="resultPanel"></div></section>' : '<section class="choice-area"><p class="choice-title">完结</p><div class="result-panel is-visible"><div class="result-body">' + renderParagraph('【本章文本已到达完结章节】') + '</div></div></section>');
      statusText.textContent = "当前：" + chapter.title + "。选对后继续，选错后进入结局页。";
      renderProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showFinalEnding() {
      const chapter = chapters[current];
      const finalLines = chapter.finalEnding || [];
      endingView.classList.remove("is-visible");
      endingView.innerHTML = "";
      chapterView.classList.remove("hidden");
      chapterView.innerHTML =
        '<header class="chapter-top"><div><h2 class="chapter-title">结局</h2></div></header>' +
        '<section class="story-scroll" data-story-reader><div class="story-block">' +
        (finalLines.length ? finalLines.map(renderParagraph).join("") : renderParagraph('【结局文本占位符】')) +
        '</div></section>' +
        '<section class="choice-area"><p class="choice-title">完结</p><div class="result-panel is-visible"><div class="result-body"><p><button class="reset-button" type="button" id="resetEnding">回到本节选择</button></p></div></div></section>';
      document.getElementById("resetEnding").addEventListener("click", function() {
        renderChapter(current);
      });
      statusText.textContent = "已进入最终结局。";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showResult(choice) {
      const chapter = chapters[current];
      const resultPanel = document.getElementById("resultPanel");
      if (!choice.correct) {
        chapterView.classList.add("hidden");
        endingView.classList.add("is-visible");
        endingView.innerHTML =
          '<div class="ending-card"><h2>' + escapeHtml(choice.resultTitle) + '</h2>' +
          choice.result.map(renderParagraph).join("") +
          '<button class="reset-button" type="button" id="resetEnding">回到本节选择</button></div>';
        document.getElementById("resetEnding").addEventListener("click", function() {
          renderChapter(current);
        });
        statusText.textContent = "已进入结局页，可返回本节重新选择。";
        return;
      }

      const hasNext = choice.correct && !choice.reward && current + 1 < chapters.length;
      if (hasNext) unlocked = Math.max(unlocked, current + 1);
      resultPanel.classList.add("is-visible");
      resultPanel.innerHTML =
        '<div class="result-head"><strong>' + escapeHtml(choice.resultTitle) + '</strong><span>' + escapeHtml(chapter.title) + ' / ' + choice.key + '</span></div>' +
        '<div class="result-body">' + choice.result.map(renderParagraph).join("") +
        (hasNext ? '<p><button class="next-button" type="button" id="nextChapter">进入下一章节</button></p>' : choice.reward ? '<p><button class="next-button final-button" type="button" id="finalEndingButton">进入结局</button></p>' : renderParagraph('【后续章节待补】')) +
        '</div>';
      if (hasNext) {
        document.getElementById("nextChapter").addEventListener("click", function() {
          renderChapter(current + 1);
        });
        statusText.textContent = "路线正确，下一章节已解锁。";
      } else if (choice.reward) {
        document.getElementById("finalEndingButton").addEventListener("click", showFinalEnding);
        statusText.textContent = "奖励路线已展开，可进入结局。";
      } else {
        statusText.textContent = "当前文本到这里暂时待续。";
      }
      renderProgress();
    }

    noteClose.addEventListener("click", closeInlineNote);
    noteModal.addEventListener("click", function(event) {
      if (event.target === noteModal) closeInlineNote();
    });
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape" && noteModal.classList.contains("is-visible")) closeInlineNote();
    });

    chapterView.addEventListener("click", function(event) {
      const noteButton = event.target.closest("[data-note]");
      if (noteButton) {
        openInlineNote(noteButton.dataset.note || "");
        return;
      }
      const switchButton = event.target.closest("[data-switch-reveal] .switch-reveal-button");
      if (switchButton) {
        advanceSwitchReveal(switchButton.closest("[data-switch-reveal]"));
        return;
      }
      const button = event.target.closest("[data-choice]");
      if (button) {
        const chapter = chapters[current];
        const choice = chapter.choices.find(function(item) { return item.key === button.dataset.choice; });
        if (choice) showResult(choice);
        return;
      }
      if (event.target.closest("[data-story-reader]")) revealNextLine();
    });

    progressList.addEventListener("click", function(event) {
      const button = event.target.closest("[data-index]");
      if (!button || button.disabled) return;
      renderChapter(Number(button.dataset.index));
    });

    renderChapter(0);
  </script>
</body>
