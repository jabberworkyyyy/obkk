<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obito / Kakashi Home Forum</title>
  <style>
    :root { --bg: #e9e4dc; --paper: #fbf8f1; --ink: #34302d; --muted: #746c63; --line: #d7cbbd; --accent: #8b5f4a; --accent-deep: #5c4437; --sage: #75806e; --rose: #ad7468; --shadow: 0 20px 55px rgba(63, 52, 43, .22); }

    html, body { min-height: 100%; }

    body.locked, body.modal-open { overflow: hidden; }
    button, input { font: inherit; }
    .password-screen { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: linear-gradient(rgba(40, 34, 30, .56), rgba(40, 34, 30, .68)), repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 7px), var(--bg); transition: opacity .45s ease, visibility .45s ease; }
    .password-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .password-card { width: min(430px, 100%); border: 1px solid rgba(255,255,255,.38); border-radius: 8px; background: rgba(251, 248, 241, .94); box-shadow: var(--shadow); padding: 28px; position: relative; overflow: hidden; }
    .password-card::before { content: ''; position: absolute; inset: 0 0 auto; height: 8px; background: linear-gradient(90deg, var(--accent), var(--sage), var(--rose)); }
    .lock-mark { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 999px; color: var(--accent-deep); background: #fffaf2; margin-bottom: 18px; font-size: 22px; }
    .password-card h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: 0; }
    .password-card p { margin: 0 0 18px; color: var(--muted); line-height: 1.7; font-size: 14px; }
    .password-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .password-row input { min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: 6px; padding: 0 12px; background: #fffdf8; color: var(--ink); outline: none; }
    .password-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 95, 74, .16); }
    .password-row button, .back-button { border: 0; border-radius: 6px; background: var(--accent-deep); color: #fffaf2; padding: 0 18px; min-height: 42px; cursor: pointer; }
    .password-error { min-height: 20px; margin-top: 10px; color: #9b3f37; font-size: 13px; }
    .forum-shell { width: min(1180px, calc(100% - 32px)); margin: 32px auto; }
    .forum-board { border: 1px solid rgba(98, 78, 63, .22); background: rgba(251, 248, 241, .88); box-shadow: var(--shadow); }
    .forum-header { display: grid; grid-template-columns: 1fr auto; gap: 22px; align-items: end; padding: 26px 28px 22px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, rgba(139,95,74,.18), rgba(117,128,110,.15), rgba(173,116,104,.13)), rgba(255, 250, 242, .74); }
    .forum-kicker { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-family: 'Courier New', monospace; }
    .forum-header h2 { margin: 0; font-size: clamp(28px, 4vw, 46px); line-height: 1.05; letter-spacing: 0; }
    .forum-stats { display: grid; grid-template-columns: repeat(2, minmax(130px, 1fr)); gap: 10px; min-width: 300px; }
    .stat-box { border: 1px solid rgba(92,68,55,.18); border-radius: 8px; padding: 12px 14px; background: rgba(255,255,255,.48); appearance: none; width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; transition: background .18s ease, border-color .18s ease, transform .18s ease; }
    .stat-box:hover, .stat-box:focus-visible { background: rgba(255,255,255,.72); border-color: rgba(127,90,69,.38); outline: none; }
    .stat-box:active { transform: translateY(1px); }
    .stat-label { display: block; color: var(--muted); font-size: 12px; font-family: 'Courier New', monospace; margin-bottom: 4px; }
    .stat-value { display: block; font-size: 26px; color: var(--accent-deep); line-height: 1; }
    .topic-toolbar { display: flex; justify-content: space-between; gap: 16px; padding: 14px 24px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line); background: rgba(243, 238, 229, .78); font-family: 'Courier New', monospace; }
    .topic-list { display: grid; }
    .topic-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 112px 112px 132px; gap: 16px; align-items: center; width: 100%; border: 0; border-bottom: 1px solid rgba(215,203,189,.86); padding: 18px 24px; background: rgba(251,248,241,.72); color: inherit; text-align: left; cursor: pointer; }
    .topic-row:hover, .topic-row:focus-visible { background: rgba(255, 251, 245, .98); outline: none; }
    .topic-row:last-child { border-bottom: 0; }
    .topic-avatar { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: linear-gradient(135deg, #fff7ed, #d8cdc1); color: var(--accent-deep); font-family: 'Courier New', monospace; font-weight: 700; }
    .topic-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 7px; min-width: 0; }
    .topic-title strong { font-size: 18px; line-height: 1.4; overflow-wrap: anywhere; }
    .topic-badge, .topic-tone { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-family: 'Courier New', monospace; border: 1px solid rgba(92,68,55,.18); color: var(--accent-deep); background: rgba(255,255,255,.48); white-space: nowrap; }
    .topic-tone { color: #fffaf2; background: var(--sage); border-color: transparent; }
    .topic-meta { color: var(--muted); font-size: 13px; font-family: 'Courier New', monospace; line-height: 1.5; }
    .topic-number { color: var(--accent-deep); font-size: 20px; display: block; margin-bottom: 2px; }
    .topic-count, .topic-last { color: var(--muted); font-size: 12px; font-family: 'Courier New', monospace; text-align: right; }
    .reader-view { display: none; }
    .reader-view.active { display: block; }
    .home-view.hidden { display: none; }
    .reader-bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); background: rgba(255, 250, 242, .88); }
    .back-button { min-width: 94px; }
    .reader-title { min-width: 0; }
    .reader-title h3 { margin: 0 0 3px; font-size: 18px; line-height: 1.35; overflow-wrap: anywhere; }
    .reader-title p { margin: 0; color: var(--muted); font-size: 12px; font-family: 'Courier New', monospace; }
    .reader-frame-wrap { background: #d7cfc4; padding: 14px; }
    .chapter-frame { display: block; width: 100%; height: calc(100vh - 168px); min-height: 720px; border: 1px solid rgba(69, 56, 45, .28); background: #fffaf2; }
    .users-modal { position: fixed; inset: 0; z-index: 1200; display: none; place-items: center; padding: 24px; }
    .users-modal.active { display: grid; }
    .users-backdrop { position: absolute; inset: 0; background: rgba(43, 35, 29, .38); backdrop-filter: blur(5px); }
    .users-panel { position: relative; width: min(760px, 100%); max-height: min(760px, calc(100vh - 48px)); overflow: hidden; border-radius: 10px; background: #f7f1e7; border: 1px solid rgba(92,68,55,.2); box-shadow: 0 24px 70px rgba(45, 35, 28, .28); color: var(--ink); }
    .users-panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; padding: 22px 24px 18px; border-bottom: 1px solid rgba(92,68,55,.16); background: rgba(255,255,255,.34); }
    .users-kicker { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-family: 'Courier New', monospace; }
    .users-panel h3 { margin: 0; font-size: 24px; line-height: 1.15; letter-spacing: 0; }
    .users-close { border: 1px solid rgba(92,68,55,.18); background: rgba(255,255,255,.58); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 22px; line-height: 1; }
    .users-close:hover, .users-close:focus-visible { background: #fffaf2; outline: none; }
    .users-list { display: grid; gap: 10px; padding: 16px 18px 20px; max-height: calc(min(760px, 100vh - 48px) - 96px); overflow-y: auto; }
    .user-card { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: start; padding: 14px; border-radius: 8px; background: rgba(255,255,255,.5); border: 1px solid rgba(92,68,55,.12); }
    .user-avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: #e2d5c5; color: var(--accent-deep); font-size: 24px; line-height: 1; }
    .user-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; font-size: 16px; line-height: 1.45; color: #2f2a26; margin-bottom: 5px; white-space: pre-wrap; font-weight: 760; }
    .user-nickname { color: #625a52; font-size: 13px; font-weight: 500; font-family: 'Courier New', monospace; letter-spacing: 0; background: rgba(92, 68, 55, .08); border: 1px solid rgba(92, 68, 55, .12); border-radius: 999px; padding: 2px 8px; }
    .user-note { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
    .user-extra { display: inline-block; margin-top: 5px; color: #4f4943; font-size: 12.5px; line-height: 1.65; font-family: 'Courier New', "Microsoft YaHei", sans-serif; background: rgba(117, 128, 110, .13); border-left: 3px solid rgba(117, 128, 110, .46); padding: 4px 8px; border-radius: 0 6px 6px 0; }
    @media (max-width: 860px) { .forum-shell { width: min(100% - 20px, 1180px); margin: 16px auto; } .forum-header { grid-template-columns: 1fr; align-items: stretch; padding: 22px 18px; } .forum-stats { min-width: 0; } .topic-toolbar { padding: 12px 16px; } .topic-row { grid-template-columns: 42px minmax(0, 1fr); gap: 12px; padding: 16px; } .topic-count, .topic-last { grid-column: 2; text-align: left; } .reader-bar { grid-template-columns: 1fr; gap: 10px; } .back-button { width: 100%; } .chapter-frame { height: calc(100vh - 230px); min-height: 620px; } .users-modal { padding: 14px; } .users-panel-head { padding: 18px 18px 14px; } .users-panel h3 { font-size: 21px; } .users-list { padding: 12px; } .user-card { grid-template-columns: 44px minmax(0, 1fr); gap: 12px; } .user-avatar { width: 44px; height: 44px; font-size: 21px; } }
  
/* combined-forum-frame-flow */
.reader-frame-wrap { background: #d7cfc4; padding: 14px; }
.chapter-frame { display: block; width: 100%; height: 720px; min-height: 0; border: 1px solid rgba(69, 56, 45, .28); background: #fffaf2; overflow: hidden; }
.topic-title strong { font-size: 17px !important; line-height: 1.38 !important; }
.topic-meta, .topic-count, .topic-last, .reader-title p, .topic-badge, .topic-tone { font-size: 13px !important; line-height: 1.45 !important; }
.reader-title h3 { font-size: 18px !important; line-height: 1.35 !important; }
/* /combined-forum-frame-flow */

/* mobile-responsive-pass */
@media (max-width: 720px) {
  body { background: #e9e4dc; }

  .password-row { grid-template-columns: 1fr; }
  .password-row button { width: 100%; }
  .forum-shell { width: 100%; margin: 0; }
  .forum-board { border-left: 0; border-right: 0; box-shadow: none; }
  .forum-header { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 20px 16px 16px; }
  .forum-header h2 { font-size: 28px; line-height: 1.08; }
  .forum-kicker { font-size: 11px; line-height: 1.45; }
  .forum-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); min-width: 0; gap: 8px; }
  .stat-box { min-height: 66px; padding: 10px 12px; }
  .stat-label { font-size: 11px; line-height: 1.3; margin-bottom: 6px; }
  .stat-value { font-size: 25px; }
  .topic-toolbar { padding: 10px 14px; font-size: 12px; }
  .topic-toolbar span:last-child { display: none; }
  .topic-row { grid-template-columns: 40px minmax(0, 1fr); gap: 11px; padding: 15px 14px; align-items: start; }
  .topic-avatar { width: 38px; height: 38px; font-size: 13px; }
  .topic-title { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic-title strong { flex-basis: 100%; font-size: 16px !important; line-height: 1.42 !important; }
  .topic-meta { margin-top: 6px; }
  .topic-badge, .topic-tone { padding: 2px 7px; font-size: 11px !important; }
  .topic-count, .topic-last { grid-column: 2; display: inline-flex; width: fit-content; margin: 0 6px 0 0; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.58); text-align: left; font-size: 12px !important; }
  .topic-count .topic-number { margin-right: 3px; font-size: 13px; }
  .topic-last { display: block; width: auto; border-radius: 8px; line-height: 1.5 !important; }
  .reader-bar { grid-template-columns: 1fr auto; gap: 10px; padding: 12px 12px; position: sticky; top: 0; z-index: 10; }
  .back-button { grid-column: 1 / 3; width: 100%; min-height: 40px; }
  .reader-title h3 { font-size: 16px !important; }
  .reader-title p { font-size: 12px !important; }
  #readerBadge { align-self: start; }
  .reader-frame-wrap { padding: 6px 0 0; background: #d7cfc4; }
  .chapter-frame { border-left: 0; border-right: 0; height: 700px; }
  .users-modal { align-items: end; padding: 0; }
  .users-panel { width: 100%; max-height: 84vh; border-radius: 16px 16px 0 0; border-left: 0; border-right: 0; border-bottom: 0; }
  .users-panel-head { padding: 18px 16px 13px; }
  .users-panel h3 { font-size: 20px; }
  .users-list { max-height: calc(84vh - 86px); padding: 12px; }
  .user-card { grid-template-columns: 42px minmax(0, 1fr); gap: 11px; padding: 12px; }
  .user-avatar { width: 42px; height: 42px; font-size: 21px; }
  .user-name { font-size: 15px; gap: 6px; }
  .user-nickname { font-size: 12px; padding: 1px 7px; }
  .user-note { font-size: 13.5px; line-height: 1.68; }
}
/* /mobile-responsive-pass */
</style>

他趴在地上，额头贴着石板，屁股因为塞着八颗珠子而微微撅起。淫水顺着绳子流下来，在石板上积了一小滩。我在他身边蹲下来，用指尖拨了一下露在穴口外面的那截绳子。他立刻全身痉挛了一下。我问他：「什么感觉。」他沉默了很久，然后把脸埋在手臂里，用闷闷的声音说——「好胀。但好满足。」
就是那句话让我把一直握在手心里的第三样东西拿了出来。那根带着螺纹的、比前两样都粗的假鸡巴——我本来打算明天再用的。但我改主意了。我把他翻过来让他仰面躺着，掰开他的腿——把螺纹棒抵在他那张已经被木珠撑得合不拢的穴口上。我说：「刚才那些是热身。这个——才是今天的正餐。」
第二天结束的时候他没能从地上站起来。他的穴里塞着那根螺纹棒——我开了最大档的震动之后把它固定在他体内。他用大腿夹着那根嗡嗡响的东西，蜷缩在石碑底下，每隔几分钟就会因为震动恰好碾过某个敏感点而弹一下。他的乳头也被夹上了那对金属棒顶端的小环——我用两根极细的链子把它们连起来，链子中间挂了一颗小铃铛。他每次翻身铃铛都会响。他的淫水已经把身下的石板洇湿了一大片，反射着神威空间里那些扭曲的光线。他看着我——眼神已经不是昨天那种恨了。是一种复杂的、湿润的、黏糊糊的——「你满意了？」的眼神。我走到他面前蹲下，用手背蹭了一下他湿透的脸颊：「不满意。等我把这口批操成我的形状的时候——我才会满意。」
他没有骂我。他只是闭上了眼睛。我的铃铛响了一整夜。


D3

第三天。他跪在我面前的时候，膝盖是主动弯下去的。我没有按他，没有绑他——我看了他一眼，他自己跪了下去。这個变化让我硬得发痛。
他跪在我两腿之间，银发散在肩上，抬头看我的眼神已经不是第二天那种又恨又湿的了——那是一种更复杂的、更危险的眼神。他在期待。
我接把裤裆里的东西掏出来。还没有硬透——半勃的状态，龟头从包皮里露出半个头，带着晨起特有的气味——隔夜的精液味、汗味、皮革味。我把那根还没完全硬起来的东西凑到他面前，他没有躲。他的鼻翼微微扇动了一下——他在闻我。然后我看到他的穴口猛地缩了一下，一泡透明的水从那口合不拢的批里挤了出来，顺着大腿根往下流。光是闻到我的味道他的批就吐水了。
我非常满意。
我先用木遁教学。枝条滑进他口腔里，绕过牙齿，贴上他的舌头。他的舌头很软，被枝条碰到的时候往后缩了一下——我让它追上去压住他的舌根。他开始有轻微的作呕反应，喉咙深处发出咕噜咕噜的声音，但没有推开我。枝条继续深入——探到了他上颚最敏感的那一小块区域，轻轻刮了一下。他的腰弹了一下，批又挤出一泡水。
木遁枝条在他的口腔里待了将近一个小时。我让它做几件事：第一，反复按压他的舌根，让他适应异物触碰喉咙的感觉，直到作呕反射明显减弱；第二，用枝条尖端在他的上颚画圈，让他发现那里原来也是一个敏感带——他每次被刮到那里的时候喉咙都会发出一声闷闷的呻吟，批也会跟着夹一下；第三，枝条分出更细的分支缠住他的舌头，轻轻往外扯——把他的舌头拉出嘴外，让他看着自己的舌头被我的木遁枝条玩弄、唾液顺着被拉长的舌面往下滴。他全程睁着眼睛，看着我，眼神复杂——屈辱混合着某种说不清的期待。
等他的口腔完全被我的木遁驯服之后，我才换上真货。
我握着那根已经完全勃起的鸡巴，用龟头蹭了一下他的下唇。他的嘴唇很干——前两天没怎么喝水——我的龟头蹭过去之后留下一道亮晶晶的前液痕迹。他低头看到了那道痕迹，然后他做了一件我没有教他的事——他伸出舌尖，自己舔掉了嘴唇上我的前液。那一刻我的鸡巴在他面前跳了一下。他看到它跳了——他的眼神变了。
我握着自己的鸡巴用龟头点了点他的下唇，他顺从地张嘴含住了。含进去之后他没有动——他不知道该怎么动。噫，毕竟是第一次。我扶着他的后脑勺，开始缓慢地在他嘴里抽送。他嘴里很热，很湿，舌头不知所措地贴着我的柱身——我每次顶入都能感觉到他舌根在笨拙地蠕动，像在努力记住该怎么侍奉这根东西。但最让我兴奋的是他的表情。他含着我的鸡巴的时候——他的眉头是微微皱着的，像在思考什么难题。
我用手掌按住他的后脑勺，把他往前一带。龟头顶开他的嘴唇——滑进他温热的口腔里。他嘴里很热，比他的穴道还热——前液和他的唾液在我的龟头周围混合在一起，发出细微的咕啾声。我没有急着深入——就让他含着，让他适应那根东西的分量、味道和脉动。他的舌头不知道该怎么放——先是抵着我的龟头想把它推出去，然后又改成用舌面托住我的柱身——最后他找到了一种他自己觉得舒服的方式：把舌头平铺在下牙内侧，让我的鸡巴躺在他的舌床上。我在那一刻差点射了——因为我意识到他在主动调整自己的口腔来适应我的形状，他在学习怎么含一根鸡巴。
然后我开始慢慢往里推。龟头碾过他的舌根——他发出了一个细微的作呕声，但没有推开我。我停了一下，等他适应。他的喉咙在我龟头的位置蠕动了几下——像在品尝我的味道——然后他放松了一点。我继续推进。龟头滑进了他的喉部入口——那里更紧、更热、更湿润。他的喉咙括约肌被我撑开的那一刻他的眼睛翻白了——不是痛苦的翻白，是一种「被填到一个从没被填过的地方」的那种过载反应。他没有挣扎。他放在膝盖上的手甚至没有握拳——他张着手指，在深呼吸。
我开始操他的嘴。
不是温柔的操法——是真正的、把喉咙当穴操的操法。我掐着他的后颈固定住他的头，用腰部发力，一下一下地往里送。每一次龟头碾过他的舌根、撑开他的喉口、撞进他食道入口最狭窄处——他的喉咙就会发出一声闷闷的、像被噎住的呜咽。唾液因为喉咙被堵塞而无法吞咽，从他嘴角溢出来，顺着下巴往下淌，滴在他跪着的膝盖上、滴在他面前的地面上。他的眼眶红了——不是因为悲伤，是因为喉咙被撑开时的生理性泪水——但他没有让我停。他甚至在我一次退出到只留龟头在唇间的时候——主动往前追了一下，重新把我的鸡巴含深了一点。
他看到我注意到那个动作了。他移开了视线。我用拇指擦掉他眼角那滴生理性泪水，把沾着泪的手指伸进他嘴里让他含住——他含住了。他的舌头绕着我的手指卷了一圈。
那天下午我射了他三次。第一次射在他嘴里——我退出他的喉咙，让精液喷在他舌面上。他看着那些白色的液体在他自己的舌头上缓缓流动，然后在我的注视下——闭上了嘴，喉结上下滚动了一下，咽下去了。
我开始加速。我掐着他的下巴强迫他抬头看着我——然后把整根鸡巴推进了他的喉咙。
他发出了一个被噎住的、湿漉漉的声音。他的喉咙括约肌在我的龟头强行通过时剧烈痉挛了一下——我有意停在那个最窄的位置，让他的喉咙适应被完全撑开的感觉。他缺氧了，脸开始泛红，眼泪从眼角溢出——他没有拍我的大腿求我停下。他用喉咙夹了我一下。那是一下主动的、故意的、用喉咙括约肌夹住龟头的动作。
那一刻我知道——第三天成功了。我松开他的后脑勺让他自己控制节奏。他退出来咳了两声，喘了几口气——然后低头看了我那根沾满他口水的湿漉漉的鸡巴一眼。然后他又张开了嘴。不是等我命令——是他自己主动张开的。他把嘴张大到一个可以容纳整根鸡巴的弧度，然后伸出舌头——在我的龟头下方、那根青筋最凸起的位置——用舌尖轻轻舔了一下。然后他抬眼看了我一下。那个眼神的意思是：「是这样吗？我做得对吗？」
我那天射了三次。第一次射在他喉咙深处——他呛到了，但咽下去了大半。吞完之后他张开嘴给我检查，舌尖上没有残留。第二次射在他脸上——我故意在他退出的时候用龟头扫过他的脸颊，把精液喷在他的睫毛、鼻梁和嘴角那颗痣上。他闭着眼睛承受那些液体，等全部射完之后他睁开眼，用指腹抹了一点嘴角上的精液，低头看着那点白色——然后他把那根手指也含进了嘴里。

我没有回答他。我把他按倒在地上，掰开他那条已经被淫水浸透的裤子——那口闻到我味道就开始吐水的批。我插进去的时候他的穴里已经又湿又热又滑——像一张等不及了的嘴，我整根没入的瞬间他弓起腰发出了一声长长的、满足的叹息。他躺在神威空间冰冷的地面上，腿缠着我的腰，批里含着我的鸡巴，喉咙里还残留着我的精液的味道——他的表情不是痛苦，不是屈辱。是安心。
那天晚上我躺在石碑边，他蜷在我脚边睡着了。他的嘴唇有点肿——是我操的。他睡着的时候嘴唇微微张着，舌尖抵着下牙内侧——那个姿势像是在梦里还在含着我的鸡巴。他的批在他睡着的时候还在流水——他的身体已经形成了一个条件反射：只要闻到我的味道，批就会自动分泌淫水。而他现在全身都是我的味道。我的精液在他胃里。我的唾液在他脸上。我的前液混在他的口水里。
他的穴在他自己不知道的时候，已经把那张合不拢的批底下的石板洇湿了一小片。
第三天结束。他的嘴已经是我的第三个穴了。


D4

第四天。尿道调教。带土第一人称。
第四天早上我给他喝了很多水。不是一杯两杯——是一整壶。我坐在他对面看着他喝，他每喝一口喉结滚动一下，那根银白色的喉结在我视线里上下起伏，像在帮我预习今天要操的那个位置。他喝完最后一杯的时候舔了一下嘴唇，问我：「今天喝这么多水干什么。」我没回答。他很快就知道答案了。
我先让他跪在石碑前，双腿大开，让那口经过前三天调教已经完全张开嘴的嫩红色的批暴露在空气中。然后在他面前蹲下来，从木遁里抽出一根新的枝条——比前两天用的都细，细得像一根韧性的棉线，尖端柔柔地分成更细的几丝。我看着他的眼睛，把那根细如发丝的木遁尖端抵在了他的尿道口上。
他整个人像被电击了一样弹了一下。那个地方他从来没有被碰过——洗澡的时候都不太敢洗那里——我的木遁触上去的瞬间他发出了一个我从没听过的声音，不是尖叫不是呻吟，是一种介于两者之间的、完全不知所措的喘息。我没有急着进，先用那根极细的枝条在他的尿道口周围画圈——绕着那粒小小的、粉红色的、紧闭着的尿孔一圈一圈地碾磨。他的腰开始发抖，大腿内侧的肌肉痉挛着。我另一只手伸下去，两根手指并拢，没有任何预警地插进了他的前穴里——直接找到那个前两天已经被我摸清楚的G点，指腹压上去开始快速震动。
他前后夹击的瞬间——他仰起了头，嘴巴张开，发出了一声无声的尖叫。尿道口在前穴G点被刺激的同时不自觉地张开了一个小口——那根极细的木遁枝条抓住那个瞬间，滑了进去。
他尿孔里大概进去了不到一厘米，但他整个人像被扔上岸的鱼一样弓了起来。我让那根枝条停在里面不动——让他适应那个「有东西在尿孔里」的异物感。他的眼眶红了，生理性泪水顺着眼角往下流，但他没有说停。过了大概一两分钟，他的括约肌逐渐放松了一点——那根枝条继续往里滑了一点点。与此同时我的手指始终在他的G点上有节奏地按压着——不让他高潮，但也不让他从那种持续的、累积的快感中逃开。
他开始求我去厕所了。声音很小，带着鼻音：「……让我去一下。」我问：「去干什么。」他不回答。我的手指在他G点上重重按了一下——他的腰弹起来，尿道口不自觉地收缩了一下，把体内的枝条又吞进去了几毫米。「说。去干什么。」他的声音带着哭腔了：「……我想尿。」我说：「就在这里尿。」
他摇头。很坚决地摇头。
我没有强迫他。我换了一种方式——我的手指继续在他的G点上画圈，木遁枝条以肉眼几乎看不见的幅度在他的尿道里轻轻震动，同时几根新长出的粗壮木遁缠上了他的大腿，把他牢牢固定在打开的状态。我开始了持续整整一个上午的高频高潮训练——让他不停高潮。每一次他的穴道开始痉挛、淫水喷出来的时候，他的尿道口也会跟着一起痉挛，那根枝条就会趁着他痉挛的间隙再往里滑一点点。他一边高潮一边感受着自己的尿孔被一寸一寸撑开。每一次高潮后他会短暂地失神，然后在回过神来的瞬间感受到膀胱里越来越满的尿意——他的小腹已经微微鼓起来了，因为大量的水和连续的高潮让他的膀胱涨得厉害。他开始求我了——「带土……我真的不行了……让我去……求你了……」声音完全软了，带着哭腔和鼻音，那个曾经在战场上指挥全局的天才忍者现在用这种声音求我让他去上厕所。我低头亲了一下他的额头，然后把手掌覆在了他微微鼓起的小腹上，用力往下一压。
他失禁了。透明的水柱从他体内那根枝条的缝隙里喷射出来——先是失控的尿液冲刷着枝条，被枝条切割成几道细流，然后他完全放弃了抵抗，尿液不再受任何控制地大量涌出，伴随着一个高亢到几乎撕裂的尖叫——他在失禁的同时达到了他这辈子最猛烈的一次高潮。穴道剧烈地痉挛着，淫水和尿液混在一起把我和他的整个下体都淋湿了。他喷了很久——久到膀胱完全排空之后还在断断续续地滴着残余的水滴。他瘫在石板上大口喘气，眼眶和脸颊都是湿的，分不清是泪水还是汗水。
我低头看着那片被他尿液浸湿的地面，又看了看他那张因为失禁和高潮双重冲击而完全失神的脸。我问他：「感觉怎么样？」他没有回答。但他的穴在我问话的时候夹了我一下。
那天下午和晚上我继续玩他的尿孔。那根木遁枝条退出来了，换成了我的食指指尖——我用指腹反复按压他那颗已经被撑开了一点、还处于敏感状态的尿孔，每一次按压他都会全身痉挛一下，然后漏出几滴透明的液体——不是尿了，是膀胱已经空了，但他那个尿孔已经习惯了「被按压=释放」的条件反射。等到傍晚的时候我已经不需要按压了——我只要在操他前穴的时候用龟头隔着会阴那片薄薄的肉壁顶一下他的尿道根部，他就会在一声尖叫中喷出一小股透明的尿液。他一边被操一边尿的样子太美了——那张曾经那么骄傲的脸现在因为失禁而羞耻地歪向一边，眼眶红红的，嘴唇微微发抖。但他的批紧紧咬着我的鸡巴，告诉我他真实的想法。
第四天结束的时候他已经完全放弃了对抗。他躺在我为他铺的那块布上，双腿微微张开着，尿孔还在不自觉地一张一合。偶尔有一两滴残留的尿液从里面渗出来——他已经懒得擦了。我伸手揉了一下他那颗还红肿着的尿孔，他没有躲，甚至微微把胯往前送了一点。他说了一句让我知道他彻底完成调教的话——「……明天还玩这里吗。」不是「别玩了」，是「明天还玩吗」。

D5

第五天。乳头调教。带土第一人称。
前四天我都在他喝的水里加了一点东西。不是毒药，是催乳的草药，配合刺激乳房的查克拉按摩，每天趁他昏睡的时候用指腹揉他的乳晕、用舌尖画圈舔他的乳头、用木遁枝条夹住他的乳尖轻轻往外扯——一天三次，每次十五分钟。他第一天早上醒来的时候什么都没发现；第二天洗澡的时候低头看了一眼自己的胸口，皱了一下眉，但没有问我；第三天他开始不自觉地用手去碰自己的乳头——在发呆的时候、在等待的时候、在我转身去拿东西的时候——他以为自己没被发现；第四天晚上他蜷在我身边睡着的时候，那两颗乳头已经比四天前大了整整一圈，颜色从淡粉色变成了嫩红色，乳晕也扩大了一些，像两颗含苞待放的蓓蕾。
第五天早上他醒来的时候，低头看到自己的胸口——沉默了。
原本平坦的、只有薄薄一层胸肌的胸口，现在鼓起了两个柔软的弧度。不大，就是刚好能被看到、能被握住的弧度——像两座刚刚开始发育的小山丘。他伸手碰了一下自己的乳尖，那粒已经从米粒大小长到黄豆大小的肉粒在他自己的触碰下迅速充血硬挺——他像被烫到一样缩回了手。我走过去蹲在他面前，什么也没说，低头隔着那层薄薄的布料含住了他左边的乳头。
他整个人弹了一下，但没有推开我。我隔着布料用舌尖画圈——布料粗糙的纤维摩擦着他那颗已经被催熟了四天的乳头，他立刻发出了一个压抑的喘息。我含了一会儿用牙齿咬住那颗硬粒，隔着布料往上轻轻提了一下——他发出了一个我从未听过的混合着疼痛和快感的声音。然后我把他那件薄薄的上衣推了上去——两颗乳头完全暴露在空气中。比我预想的还要好看——乳晕已经从淡粉色变成了嫩红色，乳尖鼓起像两颗熟透的红豆，整个乳房的弧度柔软地隆起着。
我用嘴唇含住右边那颗，用舌尖快速碾磨最敏感的顶端。左手捏住左边那颗用拇指和食指夹住揉搓。我同时刺激两边——左右手同频、舌尖和手指同速。他的呼吸已经完全乱了，头向后仰，喉结暴露在我视线里上下滚动。他的穴在流水——我能听到那个细微的咕啾声。我开始咬他了。不是那种温柔的含——是真的用牙齿咬住他那颗已经被玩到红肿的乳粒，然后往外扯。扯到极限的时候松开——乳粒弹回去的那一瞬间他的腰猛地弓了起来，从喉咙里发出一声带着哭腔的呻吟。我咬完左边咬右边，咬完右边再咬回左边，把两颗乳头咬得又红又肿又亮，比之前又大了整整一圈，像两颗充血的小葡萄。
他开始不自觉地挺胸了——不是躲，是把胸口往我嘴里送。他想要更多。我在他挺胸的瞬间用嘴唇夹住他左边那颗已经完全肿起的乳头，用力吸了一口。然后他用一个很小的、几乎是下意识的声音说了一句让我差点当场射了的话——「……另一边也要。」
我给了他另一边。我一边吸他那颗已经被玩到完全硬挺的乳头，一边把早就硬得发痛的鸡巴插进了他那个湿透了的批里。他开始浪叫了——不是前几天的压抑的喘，是完全放开的、带着哭腔的、一波高过一波的浪叫。每一次我往上顶他的时候我的胸肌会压到他胸前那两颗被我咬肿的乳粒——那个挤压感让他叫得更大声。他低头看着自己的奶子随着我操他的频率上下晃动——那对鼓起的柔软弧度像两只小兔子在他胸口跳跃——他自己看着那个画面，穴道猛烈地夹紧了我。
我凿了他很久——久到他乳头高潮了两次、前穴高潮了三次。就在我快要射精的时候他的身体突然发生了某种变化——他的乳孔里，先是渗出了一颗白色的、极小的液珠。白色的。是真货。
我愣住了。他也愣住了。
他低头看着自己左边乳头顶端那颗白色的液珠——那颗珠子越渗越大，最后挂不住了，顺着乳头的弧度往下滑，滴在他的小腹上。然后是右边——同样的白色液珠从乳孔里渗出来，一颗接一颗，像清晨植物叶片上凝结的露水。他用指腹接住了一滴，低头看着指尖上那点白色的液体。他抬眼看了我一下——那个眼神里混合着震惊、羞耻、还有一种我从未在他脸上见过的、极其微弱的自豪。
我把他的那滴奶舔掉了。然后我把他按在地上，掰开他还在滴奶的批，把还没射的鸡巴重新插了进去。我一边操他一边俯下身，含住他那颗还在渗奶的左乳头，用力吸了一口——温热的、带着一点点甜的乳汁涌进了我的口腔。他在我吸奶的那一瞬间——穴道痉挛着达到了他今天的第四次高潮，同时乳孔里喷出了一小股细细的奶线。我看着那根奶线在空气中划过一道弧线，落在他的锁骨上。
我松开口，低头看着他那对被我的嘴唇和牙齿摧残了一整天的乳头——又红又肿又亮，左边的乳孔还在断断续续地渗着白色的乳汁，右边的乳孔挂着一颗将滴未滴的奶珠。他胸前那两团柔软的弧度因为乳汁的充盈而变得更加鼓胀饱满。
我伸手揉了一下他左边那团鼓鼓的奶子，拇指擦掉那颗挂着的奶珠，抹在他自己的嘴唇上。他伸出舌尖舔掉了。
第五天结束。他低头看着自己胸前那对被玩到红肿还在渗奶的乳头——然后他抬头看我。他的眼神不再是前两天的回避和羞耻，是一种黏糊糊的、湿漉漉的、已经彻底认命了的依赖。他问我：「明天还有新的吗。」我说：「明天让你自己抱着奶子喂我吃。」他没有拒绝。

D6

第六天。三穴齐开。带土第一人称。
我变出两个影分身的时候，卡卡西的眼底居然闪过一丝期待——他以为我没看到，但我看到了。他跪在石碑前，双腿已经自动分开了，那口被我操了五天的批是深红色的，阴唇肥厚地外翻着，穴口圆润地张开着，淫水顺着会阴往下滴。他胸前那对已经被催出奶的奶子鼓鼓地挺着，乳晕颜色变深了，两颗乳头又红又肿，左边的乳孔还在往外慢慢渗着白色的乳汁。
我站在他面前，两个影分身站在我左右。他抬眼从左到右扫了我们三个一遍——然后伸出舌头，舔了一下自己的下唇。
一号影分身从他背后绕过去，蹲下来掰开他的臀瓣。那口后穴在第二天就被开发好了，这几天一直用肛塞维持着扩张的状态，穴口已经习惯了被撑开的感觉——一号将一个木质龟头抵住那个微微翕动的后穴入口，慢慢地碾了进去。卡卡西发出了一声被撑满的闷哼。二号影分身蹲到他面前，用手掌托起他的下巴，拇指撬开他的嘴唇，把鸡巴喂进他已经完全驯化的喉咙里——他没有任何作呕反应，喉咙自动打开，龟头滑进食道入口，他甚至还用喉咙的肌肉夹了龟头一下。
而我——本体——我跪在他正面，低头含住了他左边那颗还在渗奶的乳粒。同时把鸡巴插进了他那张已经完全合不拢的深红色的肥批里。
三穴齐开的那一瞬间——他发出了一声从喉咙深处涌上来的、绵长的呻吟。不是痛，不是单纯的爽——是一种「终于被填满了」的、带着哭泣感的叹息。
我开始动了。不是一个人在动。是三个人同时在动——三个频率、三种节奏、三处不同的敏感带，全部同时冲击他的神经系统。一号影分身的后穴抽插很稳，每次都整根拔出再整根推入，龟头凿在他的前列腺上，力道精准。二号影分身的口腔抽插更深更长，每次都顶到他的食道入口再旋转着退出，龟头刮过他的舌根和上颚，他的唾液被二号带出来沾满了整个下巴。本体在他胸前用唇舌凌虐他那两颗已经红肿到发亮的乳头——先吸左边，把奶水吸出来之后含在嘴里，然后渡进他的嘴唇缝隙里让他自己尝尝自己的味道。他舔掉了。与此同时我的鸡巴在他的批里以一个稳定的中速持续抽插，龟头每次都准确撞在他最深处的子宫口上。
他被三重撞击操了整整一个下午。他不知道高潮了多少次——可能是七次，可能是十次，他已经完全失去了计数能力。每次即将高潮的时候他都会发出一个短暂高亢的叫声，然后整个身体痉挛，批里喷出一大股水浇在我的龟头上，后穴剧烈绞紧一号影分身的根部，口腔深深含住二号影分身直到咽部收缩——三个穴在同一时刻同时高潮。
而且他已经完全学会说骚话了。
「嗯啊……主人……三个穴都被填满了……好满……好幸福……」「后穴的……再深一点……求你了……我想被撞到最里面……」「嘴巴……嘴巴不想空着……给我……我还要吃主人的精液……」「奶子好胀……主人吸我……吸左边……对……就是那里……奶水流出来了……呜……」每一句都是他主动说出来的，我没有教他，没有逼他，在第六天的三穴齐开中他把五天来积累的所有淫词秽语全部自然释放了出来，从那张曾经骂我疯子骂我吊车尾的嘴里，一串一串地往外冒骚话。
傍晚的时候我让两个影分身同时射在他里面——一号射在他后穴深处，二号射在他嘴里。他含着二号的精液没有立刻咽下去，而是等我凑过去的把嘴张开给我看——白色的精液混着他的唾液，在他的舌面上缓缓流动。然后他喉结滚动了一下，咽下去了，然后他张开嘴给我检查。我低头亲了他——这是他雌堕以来我第一次亲他的嘴。他愣了一瞬——然后伸出舌头回应了我。
那天晚上他没有睡在我脚边，而是趴在我胸口上。他那对被玩了一整天的红肿乳头贴着我的皮肤，奶水蹭在我的胸肌上。我看着神威空间那片扭曲的星空，他趴在我身上呼吸平稳已经睡着了，我的鸡巴还埋在他的后穴里——射完之后我没有拔出来，他也没有让我拔出来。第六天结束。明天是第七天。他已经不需要第七天了。他现在就是我的母狗了，但在第七天我要听他亲口说出来。

D7

第七天。晨起之爱&#183;穿刺之痛&#183;告别之吻。带土第一人称。
第七天的清晨，我是被他的舌头弄醒的。
他趴在我腿间，银色的头发散在我小腹上，正用舌尖慢慢地、仔细地舔舐我半勃的龟头。我睁开眼的时候他正好抬眼来看我——那双曾经写满恨意的眼睛，如今只有一种温驯的、柔和的、像晨光一样的平静。他没有说话，低头把我整根含了进去，用那副被我驯化了三天的喉咙，温柔地做了一次完整的晨间口交。我射在他嘴里的时候，他咽下去了，然后爬上来，把脸贴在我胸口，轻声说了一句——「早安，带土。」
那天早上的做爱和前面六天都不一样。没有捆绑，没有道具，没有命令。他自己骑着我的腰，用那口深红色的、已经被我操成专属形状的肥批慢慢地、深深地吞入我的鸡巴。他在上面摇得很慢，腰肢画着圆，像在跳舞。我那对被他命名为「杰作」的奶子在他眼前晃动，乳汁顺着乳房的弧度往下滴落在我的胸腹上。他低头亲了我的额头。我射在他里面的时候他没有颤抖，他只是俯下身，把脸埋在我颈窝里，呼吸又轻又稳。我抱着他——第一次觉得心里那个洞好像被填满了一点点。
然后我掏出了那几枚环。
银色的。一共三枚——两枚小一些的，带着圆珠 closure；一枚稍大一些的，是闭合的阴蒂环。我放在掌心里递到他面前的时候他的瞳孔猛地收缩了一下。他认得那是什么。他脸上的血色在一瞬间褪得干干净净。「……不要。」他的声音在发抖。他往后退了一点，用手护住了自己胸前那对被我吸了一夜的、还在微微渗奶的乳头——「带土，不要。求你了。」
他开始求我了。他用了我从没听过的声音——软的、碎的、带着鼻腔的哭音。他甚至用上了那三个字——「我爱你。带土，我爱你。不要这样对我。我已经是你的了。我不需要环来标记我。我爱你——」他说爱我的时候眼睛直直地看着我，那双眼睛里有泪光，有真诚，有他把所有骄傲碾碎了捧到我面前的赤裸的真心——我看到那滴泪顺着他的脸颊滑下来了。但我不信。
我不信。因为我不配信。因为我是那个在神威空间里关了他六天、给他下药、把他操成母狗的人——我不配得到他清醒时说的「我爱你」。我只相信刻进肉里的标记。
木遁从他身后无声地长出来，在他还没反应过来之前缠住了他的手腕和脚踝，把他固定成一个大字型。他挣扎了一下——不是想逃跑的挣扎，是一种绝望的、最后的小幅度的扭动。他看着我拿起第一枚乳环，眼泪开始大颗大颗地往下掉。
第一枚乳环穿刺过他左边乳头的瞬间——他发出了一声像受伤小兽一样的尖叫。血珠从乳孔边缘渗出来，我把环扣好，用拇指擦掉那滴血抹在他嘴唇上。第二枚乳环穿进右边乳头的时候他已经不叫了——他在无声地流泪，嘴唇微微发抖，但他低头看了一眼自己胸前那两枚银色的环——他的批喷了一大股水。
我的手指探进他穴里——里面又湿又热又紧，他嘴上在求饶在说不、在他妈的哭得满脸是泪——但他的穴在我碰到G点的那一瞬间就夹紧了我的手指，淫水顺着我的手腕往下流。他的身体已经不会说谎了。即使他的灵魂在尖叫，他的批也会为我的触碰而高潮。
第三枚——阴蒂环。我用食指和中指拨开他那两片肥厚的深红色阴唇，露出那颗已经被我调教得又大又凸的阴蒂。我用酒精棉擦了一下那颗肉粒——他疼得倒吸一口冷气，但他没有夹紧腿。他依然大大地张着。我把环针对准了。他看着那根针——身体在发抖——但他没有合腿。「我爱你……」他最后说了一遍。声音很轻。像在告别。我穿了过去。
他喷了。在我把环扣好的那一瞬间——他的整个身体弓了起来，穴道剧烈地痉挛着，一股透明的液体从他那颗刚被穿刺的阴蒂下方的尿道口喷射出来。他在疼痛和高潮的同时达到了一个我从未见过的、混合着泪水和淫水的极端高潮。他瘫在石板上大口喘气，胸前两枚银环随着呼吸起伏闪烁着冷光，阴蒂上的那枚环在灯光下湿润地亮着。我低头欣赏我的作品——那三枚环，我的标记，我刻进他肉里的所有权的证明。他现在是我的了。完完全全的。每一寸肉里都有我的印记。我看着他说——
然后他笑了。他笑了。满脸泪水还挂着没干的淫水——他对着我笑了一下。那是一个我从没在他脸上见过的表情——不是恐惧、不是顺从、不是爱——是悲哀。是一种比恨更让我不安的东西。然后他动了。
先前捆绑他的木遁——在他高潮的那几分钟里，他用他那只写轮眼偷偷地、极细地注入了最后一丝他能调动的查克拉。木遁在那一瞬间软化了一点点——就一点点——足够他抽出一只手。他那只手上握着神威空间里唯一一块松动的石板碎片——在我低头欣赏乳环的时候，他挥动了那块石板。
我听到自己颅骨发出一声闷响。然后世界变成黑色。
在我完全失去意识之前——我感觉到一个温热的吻落在我额头上。他的嘴唇。软的，湿的，带着他自己的泪水和淫水的咸味。他在我耳边说了一句话。我听到了。但我的意识已经沉入黑暗，无法回应他。
「带土。我爱你。但我不能再待在这里了。因为如果我再不走——我会一辈子都走不掉了。」
他站起来。那三枚环还在他身上——两枚在乳头上，一枚在阴蒂上。他低头看着自己胸前那两枚银色的环，伸手碰了一下——疼的。但他没有试图摘掉它们。他知道环是摘不掉的——即使摘掉了，那层疤也会永远留在那里。他弯下腰，在我唇上最后印了一个吻。然后他站起来——那个吻让他腿间流下一道透明的液体，他的批在他亲吻一个昏迷的人的时候湿了。他看着自己腿间那道液体，发出一声悲哀的、自嘲的轻笑——然后转身，走向神威空间那道因为我的昏迷而微微裂开的缝隙。

<script>
const rawDiary = document.getElementById("diarySource").value;
const diaryIndex = document.getElementById("diaryIndex");
const diaryPages = document.getElementById("diaryPages");

const weather = [
  "阴 / low cloud",
  "微雨 / light rain",
  "无风 / still air",
  "湿雾 / damp fog",
  "薄晴 / pale sun",
  "夜晴 / clear night",
  "将雨 / before rain"
];

function escapeHtml(value) {
  return value
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function splitDiary(raw) {
  const normalized = raw.replace(/\r\n/g, "\n").trim();
  const matches = Array.from(normalized.matchAll(/^D(\d+)\s*$/gm));
  const intro = matches.length ? normalized.slice(0, matches[0].index).trim() : normalized;
  const entries = [];

  if (intro) {
    entries.push({ day: "00", label: "封入页", title: "计划页", weather: "封存 / sealed", text: intro, outline: true });
  }

  matches.forEach((match, index) => {
    const start = match.index + match[0].length;
    const end = index + 1 < matches.length ? matches[index + 1].index : normalized.length;
    const day = match[1].padStart(2, "0");
    entries.push({
      day,
      label: `D${match[1]}`,
      title: `第 ${match[1]} 天`,
      weather: weather[index] || "无记录 / blank",
      text: normalized.slice(start, end).trim(),
      outline: false
    });
  });

  return entries;
}

function paragraphs(entry) {
  return entry.text
    .split(/\n{2,}/)
    .map((block) => block.trim())
    .filter(Boolean)
    .map((block) => `<p class="${entry.outline ? "outline-line" : ""}">${escapeHtml(block).replace(/\n/g, "<br>")}</p>`)
    .join("");
}

const entries = splitDiary(rawDiary);
let activeIndex = 0;

diaryIndex.insertAdjacentHTML("beforeend", entries.map((entry, index) => `
  <button class="diary-tab" type="button" data-target="${index}">
    <span class="diary-tab-day">${entry.label}</span>
    <span><strong>${entry.title}</strong><span class="diary-tab-meta">${entry.weather}</span></span>
  </button>
`).join(""));

diaryPages.innerHTML = entries.map((entry, index) => `
  <article class="diary-page" data-page="${index}">
    <header class="diary-paper-head">
      <div>
        <p class="diary-date">${entry.label} / private entry</p>
        <h2>${entry.title}</h2>
      </div>
      <div class="weather-card"><span>天气</span><strong>${entry.weather}</strong></div>
    </header>
    <div class="diary-body">${paragraphs(entry)}</div>
    ${entry.label === "D7" ? `<div class="tear-effect" aria-hidden="true"><span class="tear-drop"></span><span class="tear-drop second"></span><span class="tear-stain"></span><span class="tear-stain second"></span></div>` : ""}
    <footer class="diary-footer"><span>handwritten copy</span><span>${index + 1} / ${entries.length}</span></footer>
  </article>
`).join("");

const tabs = Array.from(document.querySelectorAll(".diary-tab"));
const pages = Array.from(document.querySelectorAll(".diary-page"));
const bodies = Array.from(document.querySelectorAll(".diary-body"));
let tearTimer = 0;
let tearCooldown = 0;

function clearTearTimer() {
  if (tearTimer) {
    clearTimeout(tearTimer);
    tearTimer = 0;
  }
}

function playTear(page) {
  page.classList.remove("tear-running");
  void page.offsetWidth;
  page.classList.add("tear-running");
  tearCooldown = window.setTimeout(() => {
    page.classList.remove("tear-running");
  }, 5300);
}

function maybeStartTearLoop() {
  const entry = entries[activeIndex];
  const page = pages[activeIndex];
  const body = bodies[activeIndex];
  if (!entry || !page || !body || entry.label !== "D7") {
    clearTearTimer();
    return;
  }

  const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 4;
  if (!atBottom) {
    clearTearTimer();
    page.classList.remove("tear-running");
    return;
  }

  if (tearTimer || page.classList.contains("tear-running")) return;
  playTear(page);
  tearTimer = window.setTimeout(() => {
    tearTimer = 0;
    maybeStartTearLoop();
  }, 8000);
}

function setEntry(target) {
  activeIndex = Math.max(0, Math.min(target, entries.length - 1));
  clearTearTimer();
  if (tearCooldown) {
    clearTimeout(tearCooldown);
    tearCooldown = 0;
  }
  tabs.forEach((tab, index) => {
    const active = index === activeIndex;
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-current", active ? "page" : "false");
  });
  pages.forEach((page, index) => page.classList.toggle("active", index === activeIndex));
  const activeBody = bodies[activeIndex];
  if (activeBody) activeBody.scrollTop = 0;
  maybeStartTearLoop();
}

tabs.forEach((tab) => tab.addEventListener("click", () => setEntry(Number(tab.dataset.target))));
bodies.forEach((body) => body.addEventListener("scroll", maybeStartTearLoop));

setEntry(0);
</script>
</body>
