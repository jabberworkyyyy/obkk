<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timeline Dashboard</title><style>:root{--bg:#f6f3ee;--panel:#fffdf8;--ink:#221f1a;--muted:#716b61;--line:#e3dccc;--work:#3662ff;--study:#178f70;--life:#bd6b16;--rest:#6b5bd6;--shadow:0 18px 50px rgba(45,37,24,.10)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.9),transparent 28rem),var(--bg);color:var(--ink)}header{max-width:1180px;margin:0 auto;padding:34px 22px 18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}h1{margin:0;font-size:clamp(30px,5vw,54px);line-height:1;letter-spacing:0}.sub{margin:12px 0 0;color:var(--muted);font-size:15px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}button,select{border:1px solid var(--line);background:rgba(255,255,255,.68);color:var(--ink);border-radius:7px;min-height:36px;padding:0 11px;font:inherit;cursor:pointer}button.active{background:var(--ink);color:#fff;border-color:var(--ink)}main{max-width:1180px;margin:0 auto;padding:0 22px 48px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 16px}.stat,.panel,.event{background:rgba(255,253,248,.88);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.stat{padding:14px 15px}.stat strong{display:block;font-size:24px;line-height:1.1}.stat span{display:block;margin-top:5px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.8fr);gap:16px;align-items:start}.panel{padding:16px;overflow:hidden}.panel h2{margin:0 0 12px;font-size:17px}.timeline{display:grid;gap:9px}.event{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px;box-shadow:none}.time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}.title{font-weight:700}.note{color:var(--muted);font-size:13px;margin-top:3px}.pill{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;font-size:12px;color:#fff;margin-top:8px}.bars{display:grid;gap:10px}.barrow{display:grid;grid-template-columns:72px 1fr 54px;gap:10px;align-items:center;font-size:13px}.bartrack{height:9px;border-radius:999px;background:#eee7da;overflow:hidden}.bar{height:100%;border-radius:inherit;min-width:2px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid var(--line);background:rgba(255,255,255,.5);border-radius:7px;min-height:48px;padding:7px;cursor:pointer;text-align:left}.day.active{border-color:var(--ink);background:#fff}.day small{display:block;color:var(--muted);font-size:11px}.day strong{font-size:15px}footer{max-width:1180px;margin:0 auto;padding:0 22px 32px;color:var(--muted);font-size:12px}@media(max-width:850px){header{grid-template-columns:1fr}.toolbar{justify-content:flex-start}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.event{grid-template-columns:74px 1fr}}</style></head><body><header><div><h1>Timeline Dashboard</h1><p class="sub" id="subtitle"></p></div><div class="toolbar"><button data-range="all" class="active">&#x5168;&#x90e8;</button><button data-range="week">&#x6700;&#x8fd1; 7 &#x5929;</button><select id="daySelect"></select></div></header><main><section class="stats" id="stats"></section><section class="grid"><div class="panel"><h2 id="timelineTitle">&#x4e8b;&#x4ef6;&#x65f6;&#x95f4;&#x7ebf;</h2><div class="timeline" id="timeline"></div></div><div class="panel"><h2>&#x5206;&#x7c7b;&#x5206;&#x5e03;</h2><div class="bars" id="bars"></div><h2 style="margin-top:22px">&#x65e5;&#x671f;</h2><div class="calendar" id="calendar"></div></div></section></main><footer id="footer"></footer><script>const L={all:'\u5168\u90e8',recent:'\u6700\u8fd1 7 \u5929',timeline:'\u4e8b\u4ef6\u65f6\u95f4\u7ebf',days:'\u5929\u6570',events:'\u4e8b\u4ef6',studyWin:'\u5b66\u4e60\u7a97\u53e3',sleepPrep:'\u7761\u524d\u51c6\u5907',life:'\u751f\u6d3b',study:'\u5b66\u4e60',work:'\u5de5\u4f5c',rest:'\u4f11\u606f',to:' \u81f3 ',dot:' \u00b7 '};const range={start:'2026-05-18',end:'2026-06-30',timezone:'Asia/Shanghai',generatedAt:'2026-05-16T09:28:56.768Z'};const routine=[['08:30','09:00','\u8d77\u5e8a\u4e0e\u51fa\u95e8\u51c6\u5907','life',L.life,''],['09:00','10:00','\u5730\u94c1\u901a\u52e4\uff1a\u770b\u4e66\u6216\u80cc\u8bf5','study',L.study,''],['10:00','12:20','\u5230\u8fbe\u516c\u53f8\u5e76\u5de5\u4f5c','work',L.work,'\u4f4d\u7f6e\uff1a\u9646\u5bb6\u5634'],['12:20','13:00','\u5348\u996d','life',L.life,''],['13:00','14:00','\u5348\u4f11','rest',L.rest,''],['14:00','18:10','\u4e0b\u5348\u5de5\u4f5c','work',L.work,'\u4f4d\u7f6e\uff1a\u9646\u5bb6\u5634'],['18:10','19:10','\u5730\u94c1\u901a\u52e4\uff1a\u770b\u4e66\u6216\u80cc\u8bf5','study',L.study,''],['19:10','20:30','\u5230\u5bb6\u4e0e\u665a\u996d','life',L.life,''],['20:30','23:30','\u665a\u4e0a\u6d3b\u52a8','life',L.life,''],['23:30','23:59','\u4e0a\u5e8a\u51c6\u5907\u7761\u89c9','rest',L.rest,'']];const colors={work:'var(--work)',study:'var(--study)',life:'var(--life)',rest:'var(--rest)'};function pad(n){return String(n).padStart(2,'0')}function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function dates(){const out=[];for(let d=new Date(range.start+'T00:00:00+08:00'),e=new Date(range.end+'T00:00:00+08:00');d<=e;d.setDate(d.getDate()+1)){const w=d.getDay();if(w!==0&&w!==6)out.push(ymd(d))}return out}const allDays=dates();let visibleDays=allDays.slice(),selectedDay=allDays[0];function eventsFor(day){return routine.map((r,i)=>({id:day+'-'+i,date:day,start:r[0],end:r[1],title:r[2],categoryId:r[3],categoryLabel:r[4],note:r[5]}))}function minutes(e){const a=e.start.split(':').map(Number),b=e.end.split(':').map(Number);return (b[0]*60+b[1])-(a[0]*60+a[1])}function render(){document.getElementById('subtitle').textContent=range.start+L.to+range.end+L.dot+range.timezone;document.getElementById('footer').textContent='Generated from local Timeline for Agent data'+L.dot+'Static GitHub Pages dashboard';renderStats();renderSelect();renderCalendar();renderTimeline();renderBars()}function renderStats(){const ev=visibleDays.flatMap(eventsFor),study=ev.filter(e=>e.categoryId==='study').length,sleep=ev.filter(e=>e.title.includes('\u7761\u89c9')).length;document.getElementById('stats').innerHTML=[[L.days,visibleDays.length],[L.events,ev.length],[L.studyWin,study],[L.sleepPrep,sleep]].map(r=>'<div class="stat"><strong>'+r[1]+'</strong><span>'+r[0]+'</span></div>').join('')}function renderSelect(){const s=document.getElementById('daySelect');s.innerHTML=visibleDays.map(d=>'<option value="'+d+'" '+(d===selectedDay?'selected':'')+'>'+d+'</option>').join('');s.onchange=()=>{selectedDay=s.value;renderTimeline();renderCalendar()}}function renderCalendar(){document.getElementById('calendar').innerHTML=visibleDays.map(d=>'<button class="day '+(d===selectedDay?'active':'')+'" data-day="'+d+'"><small>'+d.slice(0,7)+'</small><strong>'+d.slice(8)+'</strong><small>10 events</small></button>').join('');document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.day;renderSelect();renderTimeline();renderCalendar()})}function renderTimeline(){const ev=eventsFor(selectedDay);document.getElementById('timelineTitle').textContent=selectedDay+' '+L.timeline;document.getElementById('timeline').innerHTML=ev.map(e=>'<article class="event"><div class="time">'+e.start+'<br>'+e.end+'</div><div><div class="title">'+e.title+'</div>'+(e.note?'<div class="note">'+e.note+'</div>':'')+'<span class="pill" style="background:'+colors[e.categoryId]+'">'+e.categoryLabel+'</span></div></article>').join('')}function renderBars(){const totals=new Map();visibleDays.flatMap(eventsFor).forEach(e=>totals.set(e.categoryId,(totals.get(e.categoryId)||0)+minutes(e)));const labels={life:L.life,study:L.study,work:L.work,rest:L.rest},rows=Array.from(totals.entries()).sort((a,b)=>b[1]-a[1]),max=Math.max(...rows.map(r=>r[1]),1);document.getElementById('bars').innerHTML=rows.map(r=>'<div class="barrow"><span>'+labels[r[0]]+'</span><div class="bartrack"><div class="bar" style="width:'+Math.max(3,r[1]/max*100)+'%;background:'+colors[r[0]]+'"></div></div><span>'+Math.round(r[1]/60)+'h</span></div>').join('')}document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-range]').forEach(x=>x.classList.remove('active'));b.classList.add('active');visibleDays=b.dataset.range==='week'?allDays.slice(0,7):allDays.slice();selectedDay=visibleDays[0];render()});render();</script></body></html>
